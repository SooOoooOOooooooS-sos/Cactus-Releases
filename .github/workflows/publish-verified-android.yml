name: Verify public Android download
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/publish-verified-android.yml"]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download tested APK and verify integrity
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 -o Cactus-Android.apk https://github.com/SooOoooOOooooooS-sos/Cactus-Releases/releases/download/android-v2.0.11/Cactus-2.0.11-Android.apk
          echo '829f1cbc502d08ef2177a376ec09220f7c2490a983bd5139a2fc4a5230dd798d  Cactus-Android.apk' | sha256sum --check
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose Cactus-Android.apk | tee signature-verification.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' signature-verification.txt
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' signature-verification.txt
      - name: Record successful verification
        run: echo "Public Android APK downloaded successfully; expected SHA-256 and v2/v3 signatures verified." >> "$GITHUB_STEP_SUMMARY"
