name: Verify Android 2.0.11 archive
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify published APK integrity
        run: |
          curl --fail --location -o Cactus.apk https://github.com/SooOoooOOooooooS-sos/Cactus-Releases/releases/download/android-v2.0.11/Cactus-2.0.11-Android.apk
          echo '829f1cbc502d08ef2177a376ec09220f7c2490a983bd5139a2fc4a5230dd798d  Cactus.apk' | sha256sum --check
